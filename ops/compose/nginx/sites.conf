server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/admin;
    index macsad_admin.html;

    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        try_files /macsad_admin.html =404;
    }

    location = /api/v1/health {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        proxy_pass http://127.0.0.1:18081/api/v1/health;
    }

    location ^~ /api/ {
        return 404;
    }

    location / {
        try_files $uri =404;
    }
}

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html/public;
    index macsad_public.html;

    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        try_files /macsad_public.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
